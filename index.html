function render(vals){let [c,rw]=dims();board.className='board '+(theme==='gems'?'cascade':theme==='fruits'?'classic':'');board.style.setProperty('--cols',c);let a=vals||Array.from({length:c*rw},r);board.innerHTML=`<div class=reels>${a.map((x,i)=>`<div class=cell data-i="${i}"><span class=ico>${x}</span></div>`).join('')}</div>`;feature.textContent=featureText();return a}
function featureText(){return {pharaoh:`BOOK FREE SPINS: ${fs}`,dragon:'FIRE METER · STACKED DRAGON WILDS',gems:`CASCADE MULTIPLIER ×${mult}`,fruits:'CLASSIC RESPIN MODE',viking:'SHIELD WILD METER',aztec:'SCATTER PICK & WIN',wolf:'FULL MOON METER',ocean:'PEARL RESPIN METER',western:'GOLD RESPIN METER',ancient:'MYSTERY TREASURE METER'}[theme]}
function changeBet(n){if(!busy){stake=Math.max(50,Math.min(1000,stake+n));bet.textContent=stake}}function maxbet(){stake=1000;bet.textContent=stake}function toggleAuto(){auto=!auto;document.getElementById('auto').classList.toggle('active',auto);if(auto&&!busy)spin()}function toggleTurbo(){turbo=!turbo;document.getElementById('turbo').classList.toggle('active',turbo)}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'🔊 SOUND':'🔇 SOUND'}
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.08,type='sine',vol=.035,delay=0,f2=0){if(!sound)return;let a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function hiss(d=.12,vol=.025,delay=0){if(!sound)return;let a=ac(),b=a.createBuffer(1,Math.ceil(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++){let e=1-i/x.length;x[i]=(Math.random()*2-1)*e}let n=a.createBufferSource(),g=a.createGain();n.buffer=b;g.gain.value=vol;n.connect(g);g.connect(a.destination);n.start(a.currentTime+delay)}
function slotSpin(){hiss(.42,.022);tone(78,.4,'sawtooth',.012,0,145);tone(118,.35,'triangle',.012,.04,190)}
function reelStop(i=0){hiss(.045,.035);tone(112+i*8,.075,'triangle',.055,0,72+i*5);tone(52,.06,'sine',.04)}
function coinTick(delay=0){tone(1180,.055,'sine',.026,delay);tone(1760,.045,'sine',.015,delay+.025)}
function slotWin(big=false){let notes=big?[523,659,784,1047,1319,1568]:[523,659,784,1047];notes.forEach((f,i)=>{tone(f,.23,'triangle',.038,i*.07);coinTick(i*.07+.02)})}
function bonusFan(){[392,494,587,784,988,1175,1568].forEach((f,i)=>tone(f,.32,'triangle',.045,i*.075));for(let i=0;i<9;i++)coinTick(i*.055)}
function featureHit(){tone(180,.18,'sawtooth',.025,0,320);tone(640,.22,'triangle',.035,.1,960)}
function lineWin(a,c,rw){let w=0,idx=[];for(let y=0;y<rw;y++){let x=a[y*c],n=1;for(let z=1;z<c;z++){if(a[y*c+z]===x)n++;else break}if(n>=3){w+=stake*(n-2)*2;for(let z=0;z<n;z++)idx.push(y*c+z)}}return[w,idx]}
function spin(){if(busy||coins<stake)return;busy=true;coins-=stake;save();win.textContent=0;msg.textContent='SPIN...';slotSpin();let [c,rw]=dims(),a=Array.from({length:c*rw},r);
if(theme==='dragon'&&Math.random()<.24){let col=1+Math.floor(Math.random()*(c-2));for(let y=0;y<rw;y++)a[y*c+col]='🐉'}
if(theme==='wolf'&&Math.random()<.18){for(let i=0;i<a.length;i++)if(Math.random()<.16)a[i]='🌕'}
if(theme==='ancient'&&Math.random()<.16){for(let i=0;i<a.length;i++)if(Math.random()<.18)a[i]='❓'}
let cells=[...document.querySelectorAll('.cell')];cells.forEach((el,i)=>{el.classList.add('drop');let z=setInterval(()=>el.firstChild.textContent=r(),turbo?35:55);setTimeout(()=>{clearInterval(z);el.firstChild.textContent=a[i];reelStop(i%c)},(turbo?230:620)+(i%c)*(turbo?25:85))});
setTimeout(()=>finish(a,c,rw),(turbo?430:980)+(c-1)*(turbo?25:85))}
function finish(a,c,rw){let w=0,idx=[];if(theme==='gems'){let counts={};a.forEach(x=>counts[x]=(counts[x]||0)+1);let hit=Object.entries(counts).find(x=>x[1]>=8);if(hit){w=stake*mult*2;mult=Math.min(10,mult+1);document.querySelectorAll('.cell').forEach((e,i)=>{if(a[i]===hit[0])e.classList.add('win')});msg.textContent=`CASCADE! ×${mult}`;featureHit();setTimeout(()=>{let b=a.map(x=>x===hit[0]?r():x);render(b);document.querySelectorAll('.cell').forEach(e=>e.classList.add('drop'))},500)}else mult=1}
else if(theme==='fruits'){let mid=[a[3],a[4],a[5]];if(mid[0]===mid[1]&&mid[1]===mid[2]){w=stake*(mid[0]==='7️⃣'?20:8);idx=[3,4,5]}else if(Math.random()<.12){msg.textContent='RESPIN!';featureHit();setTimeout(()=>{busy=false;spin()},450);return}}
else{[w,idx]=lineWin(a,c,rw)}
if(theme==='pharaoh'){let books=a.filter(x=>x==='📕').length;if(books>=3){fs+=8;w+=stake*3;msg.textContent='FREE SPINS!';bonusFan();}}
if(theme==='aztec'&&a.filter(x=>x==='🏛️').length>=3){w+=stake*(2+Math.floor(Math.random()*8));msg.textContent='PICK & WIN BONUS!';bonusFan()}
if(theme==='ocean'&&a.filter(x=>x==='🦪').length>=3){w+=stake*5;msg.textContent='PEARL RESPIN!';bonusFan()}
if(theme==='western'&&a.filter(x=>x==='💰').length>=3){w+=stake*6;msg.textContent='GOLD RESPIN!';bonusFan()}
if(theme==='viking'&&a.filter(x=>x==='🛡️').length>=3){w+=stake*4;msg.textContent='SHIELD BONUS!';bonusFan()}
idx.forEach(i=>document.querySelectorAll('.cell')[i]?.classList.add(theme==='dragon'?'fire':'win'));if(w){coins+=w;win.textContent=w.toLocaleString('de-DE');if(!msg.textContent.includes('BONUS')&&!msg.textContent.includes('RESPIN')&&!msg.textContent.includes('FREE'))msg.textContent='GEWINN '+w.toLocaleString('de-DE');slotWin(w>=stake*10)}else if(msg.textContent==='SPIN...')msg.textContent='NOCH EIN SPIN!';if(fs&&theme==='pharaoh'){fs--;setTimeout(()=>{busy=false;spin()},550);save();return}save();feature.textContent=featureText();busy=false;if(auto)setTimeout(spin,350)}
cards();save();
</script></body></html>
