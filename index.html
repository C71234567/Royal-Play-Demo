function evalWin(m){let total=0,hits=[];pay.forEach((ln,li)=>{let first=m[0][ln[0]],n=1;for(let c=1;c<5;c++){let s=m[c][ln[c]];if(s===first||s==='book'||first==='book'){n++;if(first==='book'&&s!=='book')first=s}else break}if(n>=3){let mult={anubis:12,pharaoh:10,queen:8,eye:6,ankh:5,A:4,K:4,Q:3,J:3,book:5}[first]||3;total+=Math.round(bet/10*mult*(n-2));for(let c=0;c<n;c++)hits.push([c,ln[c]]);document.querySelectorAll('.line')[li].classList.add('on')}});return[total,hits]}
async function spinGame(){if(busy||(!free&&coins<bet))return;busy=true;document.querySelectorAll('.line').forEach(x=>x.classList.remove('on'));win.textContent='0';if(!free)coins-=bet;else free--;save();msg.textContent=free?`FREISPIEL · ${free} ÜBRIG`:'WALZEN LAUFEN...';spinSfx();let next=Array.from({length:5},()=>Array.from({length:3},rand));reels.forEach((r,i)=>r.render(next[i]));await Promise.all(reels.map(r=>r.spin()));current=next;let books=next.flat().filter(x=>x==='book').length;if(books>=3){free+=10;expanding=SYMS.filter(x=>!['book'].includes(x))[Math.floor(Math.random()*(SYMS.length-1))];msg.textContent=`10 FREISPIELE · EXPANDING: ${expanding.toUpperCase()}`;bonusSfx()}
let [w,hits]=evalWin(next);if(free&&expanding){let cols=[];for(let c=0;c<5;c++)if(next[c].includes(expanding))cols.push(c);if(cols.length>=3){w+=bet*cols.length*2;cols.forEach(c=>[...reels[c].icons.children].forEach(im=>{im.src=ART[expanding];im.classList.add('expand')}));msg.textContent=`EXPANDING ${expanding.toUpperCase()}!`}}
hits.forEach(([c,r])=>reels[c].icons.children[r]?.classList.add('win'));if(w){coins+=w;win.textContent=w.toLocaleString('de-DE');if(books<3)msg.textContent=`GEWINN ${w.toLocaleString('de-DE')} COINS`;winSfx(w>=bet*10)}else if(books<3)msg.textContent=free?`FREISPIELE: ${free}`:'NOCH EIN SPIN!';save();feature.textContent=`10 PAYLINES · BOOK WILD/SCATTER · FREISPIELE ${free}`;busy=false;if(auto||free)setTimeout(spinGame,turbo?180:650)}
spin.onclick=spinGame;auto.onclick=()=>{auto=!auto;$('auto').classList.toggle('active',auto);if(auto&&!busy)spinGame()};turbo.onclick=()=>{turbo=!turbo;$('turbo').classList.toggle('active',turbo)};snd.onclick=()=>{sound=!sound;snd.textContent=sound?'🔊 SOUND':'🔇 SOUND'}
</script></body></html>
